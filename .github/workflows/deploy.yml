name: Deploy to Cloudflare

# Every push to main ships. Cloudflare's own Git integration stopped firing
# silently once, leaving the site a day behind with nothing in the deployment
# list to explain it - this runs in GitHub, where a failed attempt is visible
# and its log is readable.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order. Two overlapping uploads to the same Worker
# is a coin toss over which code ends up live.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # wrangler.jsonc builds the site itself before uploading, and that build
      # needs the workspace dependencies present.
      - name: Install dependencies
        run: npm ci

      # Cheap, and it fails here rather than halfway through a deploy.
      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the site answers
        run: |
          sleep 15
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://newschannel12app.wrcd563.workers.dev/api/health || true)
            echo "attempt $attempt: /api/health -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "The Worker deployed but is not answering on /api/health."
          exit 1
